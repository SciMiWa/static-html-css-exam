<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Aan Tafel: StartPagina</title>
</head>

<body>
    <header>
        <p>Aan Tafel</p>
        <nav>
            <ul>
                <li>Startpagina</li>
                <li>Onze Missie</li>
                <li>Recepten</li>
                <li>Inschrijven</li>
            </ul>
        </nav>
    </header>

    <main>
        <figure>
            <img src="img/startpagina/h1.jpg"
                alt="	Oma dient een dampend gerecht op aan een lange houten tafel vol lachende familie van drie generaties.">
        </figure>

        <figure>
            <img src="img/startpagina/h2.jpg"
                alt="Koppel deelt pasta en rode wijn aan een geruit tafelkleed in een trattoria.">
        </figure>

        <figure>
            <img src="img/startpagina/h3.jpg"
                alt="Twee koppels delen mezze en vis op een terras aan zee bij zonsondergang.">
        </figure>

        <figure>
            <img src="img/startpagina/h4.jpg" alt="Drie lachende vrienden eten hamburgers en frietjes in de zetel.">
        </figure>

        <figure>
            <img src="img/startpagina/h5"
                alt="Vrouw ontbijt met koffie aan de keukentafel terwijl haar golden retriever zijn kop op haar knie legt">
        </figure>

        <q>
            "Iemand aan tafel uitnodigen,
            is zorgen voor zijn geluk zolang
            hij onder jouw dak is."
        </q>
    </main>

    <section class="news">
        <p>Nieuws uit de voedselwereld</p>

        <figure>
            <img src="img/startpagina/n1.jpg"
                alt="Verkoopster geeft een klant een papieren zak groenten mee op een boerenmarkt.">
            <p>Nieuwstitel 1</p>
        </figure>

        <figure>
            <img src="img/startpagina/n2.jpg"
                alt="Buren van verschillende leeftijden oogsten samen tomaten in een buurttuin.">
            <p>Nieuwstitel 2</p>
        </figure>

        <figure>
            <img src="img/startpagina/n3.jpg"
                alt="Chef werkt met een pincet een bord af in een kleine restaurantkeuken.">
            <p>Nieuwstitel 3</p>
        </figure>

        <figure>
            <img src="img/startpagina/n4.jpg"
                alt="Moeder en twee kinderen kneden samen brooddeeg op een bebloemde tafel.">
            <p>Nieuwstitel 4</p>
        </figure>

    </section>

    <section class="new-recipes">

        <p>Nieuwe recepten</p>

        <figure>
            <img src="img/startpagina/r1.jpg"
                alt="Shakshuka in een gietijzeren pan, met brood ernaast.">
            <p>Shakshuka met eieren en peterselie.</p>
        </figure>

        <figure>
            <img src="img/startpagina/r2.jpg" alt="Ramen gerecht in een kom.">
            <p>Ramen met half gekookt ei, lente-ui, varkensvlees en nori.</p>
        </figure>

        <figure>
            <img src="img/startpagina/r3.jpg"
                alt="Apple taart met rasterdeeg op een geruit doek, met een stuk op een bordje.">
            <p>Appeltaart</p>
        </figure>

        <figure>
            <img src="img/startpagina/r4.jpg" alt="Brusselse wafel in een gezellig café.">
            <p>Brusselse Wafel met Aardbeien en poedersuiker.</p>
        </figure>

    </section>

    <footer>

        <p></p>

        <nav>
            <ul>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </ul>
        </nav>

        <p></p>

    </footer>

</body>

</html>
