  <!-- eten: dampende kom -->
  <g fill="#8A2E3B">
    <path d="M24 20h16a8 8 0 0 1-16 0z"/>
    <rect x="28" y="28" width="8" height="1.8" rx=".9"/>
  </g>
  <g fill="none" stroke="#C27A45" stroke-width="1.5" stroke-linecap="round">
    <path d="M28 17.5c-1.3-1.4 1.3-2.6 0-4.4"/>
    <path d="M32 17.5c-1.3-1.4 1.3-2.6 0-4.4"/>
    <path d="M36 17.5c-1.3-1.4 1.3-2.6 0-4.4"/>
  </g>
  <!-- verbinding: twee mensen aan tafel, naar elkaar gericht -->
  <g fill="#8A2E3B">
    <circle cx="8.5" cy="25" r="3.8"/>
    <path d="M2.5 42v-3.5a6 6 0 0 1 12 0V42z"/>
