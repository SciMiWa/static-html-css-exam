<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t d">
  <title id="t">Logo Aan Tafel</title>
  <desc id="d">Twee mensen aan weerszijden van een open boek, met tussen hen een tekstballon met een dampende kom.</desc>
  <!-- verhaal en geschiedenis: open boek met leeslint -->
  <g stroke="#8A2E3B" stroke-width="2.4" stroke-linejoin="round" fill="#f7eee1">
    <path d="M32 47c-6-3.6-15.5-4.2-25-2.4v13c9.5-1.8 19-1.2 25 2.4z"/>
    <path d="M32 47c6-3.6 15.5-4.2 25-2.4v13c-9.5-1.8-19-1.2-25 2.4z"/>
  </g>
  <g stroke="#C27A45" stroke-width="1.3" stroke-linecap="round" fill="none">
    <path d="M11 49c5-.8 10-.6 15.5 1"/>
    <path d="M11 53c5-.8 10-.6 15.5 1"/>
    <path d="M37.5 50c5.5-1.6 10.5-1.8 15.5-1"/>
    <path d="M37.5 54c5.5-1.6 10.5-1.8 15.5-1"/>
  </g>
  <path d="M32 47v14l2-2 2 2V46" fill="#C27A45" opacity=".9"/>
  <!-- nieuws en verbinding: tekstballon, verhalen delen aan tafel -->
  <path d="M25 3h14a8.5 8.5 0 0 1 8.5 8.5v13a8.5 8.5 0 0 1-8.5 8.5h-3l-4 6-4-6h-3a8.5 8.5 0 0 1-8.5-8.5v-13A8.5 8.5 0 0 1 25 3z"
