<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Inschrijven</title>
</head>
<body class="subscription-body">
    <header id="header">
        <h1>Aan Tafel</h1>
        <nav id="nav-bar">
            <ul>
                <li class="startpagina-header">
                    <a href="index.html">Startpagina</a>
                </li>
                <li class="onze-missie-header">
                    <a href="onze-missie.html">Onze Missie</a>
                </li>
                <li>
                    <a href="recepten.html">Recepten</a>
                </li>
                <li id="active-page">
                    <a href="inschrijven.html">Inschrijven</a>
                </li>
            </ul>
        </nav>
    </header>


    <main>

        <section class="subscription-top-pics">

            <picture>
                <source media="(min-width: 1024px)" srcset="img/inschrijven/desktop/i2.jpg">
                <source media="(min-width: 600px) and (max-width: 1023px)" srcset="img/inschrijven/tablet/i2.jpg">
                <img src="img/inschrijven/mobiel/i2.jpg" alt="Romeinen lezen de aangeplakte berichten van de Acta Diurna op het Forum">
            </picture>

            <picture class="tablet-pic">
                <source media="(min-width: 1024px)" srcset="img/inschrijven/desktop/i3.jpg">
                <source media="(min-width: 600px) and (max-width: 1023px)" srcset="img/inschrijven/tablet/i3.jpg">
                <img src="img/inschrijven/mobiel/i3.jpg" alt="Vier Chinese ambtenaren lezen samen een hofbulletin op een rol in een binnenplaats">
            </picture>

            <picture class="desktop-pic">
                <source media="(min-width: 1024px)" srcset="img/inschrijven/desktop/i1.jpg">
                <source media="(min-width: 600px) and (max-width: 1023px)" srcset="img/inschrijven/tablet/i1.jpg">
                <img src="img/inschrijven/mobiel/i1.jpg" alt="Omroeper met een perkamentrol verkondigt nieuws aan een menigte op de agora in Athene">
            </picture>

            <picture class="desktop-pic">
                <source media="(min-width: 1024px)" srcset="img/inschrijven/desktop/i4.jpg">
                <source media="(min-width: 600px) and (max-width: 1023px)" srcset="img/inschrijven/tablet/i4.jpg">
                <img src="img/inschrijven/mobiel/i4.jpg" alt="Venetiaanse schrijver kopieert bij kaarslicht nieuwsbrieven met een ganzenveer terwijl anderen meekijken">
            </picture>

        </section>


        <form action="#" method="post">
            <fieldset>
                <legend>Inschrijfformulier voor nieuwsbrief</legend>
                <div>
                    <label for="voornaam">Voornaam</label>
                    <input type="text" id="voornaam" required maxlength="100">
                </div>

                <div>
                    <label for="familienaam">Familienaam</label>
                    <input type="text" id="familienaam" required maxlength="100">
                </div>

                <div>
                    <label for="e-mailadres">E-mailadres</label>
                    <input type="text" id="e-mailadres" required maxlength="254">
                </div>
                <button type="submit">Inschrijven voor nieuwsbrief</button>
            </fieldset>
        </form>


        <section class="subscription-bottom-pics">

            <picture>
                <source media="(min-width: 1024px)" srcset="img/inschrijven/desktop/i6.jpg">
                <source media="(min-width: 600px) and (max-width: 1023px)" srcset="img/inschrijven/tablet/i6.jpg">
                <img src="img/inschrijven/mobiel/i6.jpg" alt="Vrouw in een herberg wijst naar een broadside met houtsnede die aan een balk hangt">
            </picture>

            <picture class="tablet-pic">
                <source media="(min-width: 1024px)" srcset="img/inschrijven/desktop/i5.jpg">
                <source media="(min-width: 600px) and (max-width: 1023px)" srcset="img/inschrijven/tablet/i5.jpg">
                <img src="img/inschrijven/mobiel/i5.jpg" alt="Verkoper deelt pamfletten uit aan marktbezoekers in een middeleeuwse stad">
            </picture>

            <picture class="desktop-pic">
                <source media="(min-width: 1024px)" srcset="img/inschrijven/desktop/i7.jpg">
                <source media="(min-width: 600px) and (max-width: 1023px)" srcset="img/inschrijven/tablet/i7.jpg">
                <img src="img/inschrijven/mobiel/i7.jpg" alt="Heren met driekantige hoeden bespreken een krant in een koffiehuis bij het haardvuur">
            </picture>

            <picture class="desktop-pic">
                <source media="(min-width: 1024px)" srcset="img/inschrijven/desktop/i8.jpg">
                <source media="(min-width: 600px) and (max-width: 1023px)" srcset="img/inschrijven/tablet/i8.jpg">
                <img src="img/inschrijven/mobiel/i8.jpg" alt="Gezin leest samen een geïllustreerde krant bij het licht van een olielamp">
            </picture>

        </section>


    </main>


    <footer id="test">

        <p>Aan Tafel</p>

        <nav>
            <a href="#header">Back to Top</a>
        </nav>

    </footer>

</body>
</html>
